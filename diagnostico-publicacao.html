<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diagnóstico de publicação — Estudo Flex 0.9.1</title>
    <style>
        :root { font-family: system-ui, sans-serif; color-scheme: light dark; }
        body { margin: 0; padding: 24px; background: #f6f7fc; color: #202236; }
        main { max-width: 820px; margin: auto; background: white; border-radius: 18px; padding: 24px; box-shadow: 0 12px 40px #25284a1f; }
        h1 { margin-top: 0; }
        button { padding: 12px 18px; border: 0; border-radius: 10px; background: #5b5ceb; color: white; font-weight: 700; }
        ul { padding: 0; list-style: none; }
        li { margin: 8px 0; padding: 10px 12px; border-radius: 10px; background: #f2f3fa; overflow-wrap: anywhere; }
        .ok { border-left: 5px solid #16885a; }
        .fail { border-left: 5px solid #c73a3a; }
        code { font-size: .9em; }
    </style>
</head>
<body>
<main>
    <p><strong>Estudo Flex Languages 0.9.1</strong></p>
    <h1>Diagnóstico da publicação</h1>
    <p>Esta página verifica se os arquivos essenciais chegaram ao GitHub Pages.</p>
    <button id="run" type="button">Verificar novamente</button>
    <p id="summary" role="status" aria-live="polite"></p>
    <ul id="results"></ul>
</main>
<script type="module">
const version = "0.9.1";
const files = [
    "./index.html", "./manifest.json", "./sw.js", "./core/bootstrap.js", "./core/app.js",
    "./core/router.js", "./core/state.js", "./core/storage.js", "./core/profile-options.js",
    "./css/main.css", "./css/v090.css", "./css/v091.css", "./data/onboarding.js",
    "./services/achievement-service.js", "./services/review.service.js", "./services/lesson.service.js",
    "./services/speech-recognition.service.js", "./services/mentor-chat.service.js",
    "./components/onboarding/ef-welcome.js", "./components/onboarding/ef-onboarding.js",
    "./components/onboarding/ef-goals.js", "./components/home/ef-home-page.js", "./components/lesson/ef-lesson-page.js",
    "./components/review/ef-review-page.js", "./components/speaking/ef-speaking-page.js",
    "./components/mentor/ef-mentor-page.js", "./components/profile/ef-profile-page.js",
    "./components/passport/ef-passport-page.js", "./components/professional/ef-professional-study-page.js"
];
const results = document.getElementById("results");
const summary = document.getElementById("summary");
async function run() {
    results.replaceChildren();
    summary.textContent = "Verificando…";
    const checks = await Promise.all(files.map(async (path) => {
        try {
            const url = new URL(path, document.baseURI);
            url.searchParams.set("v", version);
            const response = await fetch(url, { cache: "no-store" });
            return { path, ok: response.ok, status: response.status };
        } catch { return { path, ok: false, status: 0 }; }
    }));
    for (const check of checks) {
        const li = document.createElement("li");
        li.className = check.ok ? "ok" : "fail";
        const code = document.createElement("code");
        code.textContent = `${check.ok ? "OK" : "ERRO"} ${check.status || "sem resposta"} — ${check.path}`;
        li.append(code);
        results.append(li);
    }
    const failures = checks.filter((item) => !item.ok);
    summary.textContent = failures.length
        ? `${failures.length} arquivo(s) ausente(s). Reenvie o pacote completo para a raiz do repositório.`
        : "Todos os arquivos essenciais da versão 0.9.1 estão publicados.";
}
document.getElementById("run").addEventListener("click", run);
run();
</script>
</body>
</html>
