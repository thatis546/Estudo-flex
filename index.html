<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Estudo Flex Languages: aprendizado de idiomas personalizado, conversação, trilhas, passaporte e treinamento profissional.">
    <meta name="theme-color" content="#5b5ceb">
    <meta name="estudo-flex-version" content="0.9.0">

    <title>Estudo Flex Languages</title>

    <link rel="icon" href="./favicon.ico">
    <link rel="manifest" href="./manifest.json">
    <link rel="stylesheet" href="./css/main.css?v=0.9.0">

    <script type="module" src="./core/bootstrap.js?v=0.9.0"></script>
</head>

<body>
    <a class="skip-link" href="#mainContent">Pular para o conteúdo principal</a>
    <ef-header hidden></ef-header>

    <div class="app-shell">
        <main id="mainContent" tabindex="-1">

            <section data-page="welcome" aria-label="Boas-vindas">
                <ef-welcome></ef-welcome>
            </section>

            <section data-page="onboarding" aria-label="Configuração inicial" hidden>
                <ef-onboarding></ef-onboarding>
            </section>

            <section data-page="goals" aria-label="Objetivos de aprendizagem" hidden>
                <ef-goals></ef-goals>
            </section>

            <section data-page="level-test" aria-label="Diagnóstico inicial" hidden>
                <ef-level-test></ef-level-test>
            </section>

            <section data-page="finish" aria-label="Conclusão da configuração" hidden>
                <ef-finish></ef-finish>
            </section>

            <section data-page="home" aria-label="Página inicial" hidden>
                <ef-home-page></ef-home-page>
            </section>

<!-- Seção de Idiomas - Agora um container que encapsula seus sub-componentes -->
            <section data-page="languages" aria-label="Idiomas" hidden>
                <ef-languages-page></ef-languages-page>
            </section>

            <section data-page="language-setup" aria-label="Configuração do idioma" hidden>
                <ef-language-setup></ef-language-setup>
            </section>

            <section data-page="language-diagnostic" aria-label="Diagnóstico do idioma" hidden>
                <ef-language-diagnostic></ef-language-diagnostic>
            </section>

            <section data-page="review" aria-label="Revisão de vocabulário" hidden>
                <ef-review-page></ef-review-page>
            </section>

            <section data-page="profile" aria-label="Perfil do aluno" hidden>
                <ef-profile-page></ef-profile-page>
            </section>

            <section data-page="passport" aria-label="Passaporte de idiomas e diário de bordo" hidden>
                <ef-passport-page></ef-passport-page>
            </section>

            <section data-page="mentor" aria-label="Conversa com o mentor" hidden>
                <ef-mentor-page></ef-mentor-page>
            </section>

            <section data-page="speaking" aria-label="Communication Lab e treinamento de oratória" hidden>
                <ef-speaking-page></ef-speaking-page>
            </section>

            <section data-page="professional" aria-label="Treinamento profissional" hidden>
                <ef-professional-page></ef-professional-page>
            </section>

            <section data-page="professional-study" aria-label="Estudo da trilha profissional" hidden>
                <ef-professional-study-page></ef-professional-study-page>
            </section>
        </main>

        <aside id="mentorPanel" class="mentor-panel" aria-labelledby="mentorPanelTitle" hidden>
            <header class="mentor-panel-header">
                <h2 id="mentorPanelTitle">Meu Mentor</h2>
                <button type="button" class="mentor-panel-close" data-action="close-mentor" aria-label="Fechar painel do mentor">×</button>
            </header>
            <div id="mentorFacts" class="mentor-facts" aria-live="polite"></div>
        </aside>

        <div id="overlay" class="overlay hidden" aria-hidden="true"></div>
        <div id="toast" class="toast" role="status" aria-live="polite" aria-atomic="true"></div>
    </div>

    <ef-navbar hidden></ef-navbar>

    <noscript>
        <div class="noscript-message">
            O Estudo Flex Languages precisa do JavaScript ativado para funcionar.
        </div>
    </noscript>
</body>
</html>
